name: End-to-end usability regression (Chromium + Mobile Safari)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Chromium screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-e2e-chromium
          path: test-results/*-desktop-chromium*/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload WebKit screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-e2e-webkit
          path: test-results/*-mobile-webkit*/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-e2e-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
