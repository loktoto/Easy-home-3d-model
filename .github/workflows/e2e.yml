name: End-to-end usability regression (Chromium + Mobile Safari)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-webkit]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser E2E tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Upload screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-e2e-${{ matrix.browser }}-${{ matrix.shard }}-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-e2e-${{ matrix.browser }}-${{ matrix.shard }}-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
