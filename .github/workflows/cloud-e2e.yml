name: Real local Supabase cloud E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Prepare isolated Supabase schema
        run: |
          supabase init
          for f in backend/[0-9]*.sql; do name=$(basename "$f" .sql | tr "-" "_"); supabase migration new "$name"; cp "$f" "$(find supabase/migrations -name "*_$name.sql" -print -quit)"; sleep 1; done
          supabase start
          supabase db reset --local
          supabase status -o json > /tmp/easy3d-supabase-status.json
          node -e 'const s=require("/tmp/easy3d-supabase-status.json");const fs=require("fs");fs.appendFileSync(process.env.GITHUB_ENV,"EASY3D_SUPABASE_URL="+s.API_URL+"\nEASY3D_SUPABASE_KEY="+s.ANON_KEY+"\n")'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual cloud browser end-to-end tests
        run: npx playwright test tests/e2e/cloud*.spec.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: easy3dhome-cloud-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
