name: Publish versioned Easy3DHome release
on:
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - 'scripts/package-release.py'
      - 'docs/RELEASING.md'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact reviewed main commit SHA (40 characters)'
        required: true
        type: string
      tag:
        description: 'Release tag matching package.json (example v1.1.0)'
        required: true
        type: string
      confirm:
        description: 'I reviewed exact-commit desktop/mobile screenshots and public deployment'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: easy3dhome-versioned-release
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 30 && !github.event.issue.pull_request &&
       github.event.comment.user.id == github.event.repository.owner.id &&
       github.event.sender.id == github.event.repository.owner.id &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/release '))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      approved_sha: ${{ steps.approval.outputs.approved_sha }}
      tag: ${{ steps.approval.outputs.tag }}
      publish: ${{ steps.approval.outputs.publish }}
    steps:
      - name: Normalize explicit maintainer approval
        id: approval
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMED: ${{ inputs.confirm }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            [[ "$COMMENT" =~ ^/release\ ([0-9a-f]{40})\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]
            APPROVED_SHA="${BASH_REMATCH[1]}"
            RELEASE_TAG="${BASH_REMATCH[2]}"
            CONFIRMED=true
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMED" = true
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'approved_sha=%s\ntag=%s\npublish=true\n' "$APPROVED_SHA" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  validate:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release package version
        if: needs.authorize.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test -f scripts/build-site.py
          test -f tests/e2e/release-package.spec.mjs
      - name: Require successful exact-main acceptance workflows
        if: needs.authorize.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$APPROVED_SHA"
          for workflow in site.yml e2e.yml cloud-e2e.yml release-package.yml readme-preview.yml; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$APPROVED_SHA&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.created_at, .id) | last // {}')
            jq -e --arg sha "$APPROVED_SHA" '.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success"' <<< "$run" >/dev/null || { echo "Missing successful latest exact-main run: $workflow"; exit 1; }
            jq -r '.html_url' <<< "$run"
          done
      - name: Check syntax and unit tests
        run: |
          for file in app.js core.js renderer.js i18n.js; do node --check "$file"; done
          npm run test:unit
          node --test tests/worker-release.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      # The dedicated sharded E2E workflow runs on every PR. Manual publication
      # also requires its successful exact-main result above. Do not duplicate
      # the full suite here or overwrite its screenshot evidence.
      - name: Package release assets
        run: |
          python3 scripts/package-release.py
          python3 scripts/check-repo-layout.py
          node scripts/build-worker.mjs
      - name: Verify packaged site
        env:
          TEST_PACKAGED_SITE: '1'
        run: npx playwright test tests/e2e/release-package.spec.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: easy3dhome-versioned-release
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easy3dhome-versioned-release-package-evidence
          path: |
            playwright-report/
            test-results/
  publish:
    if: needs.authorize.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: [authorize, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easy3dhome-versioned-release
          path: release
      - name: Verify checksum and deployed revision
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          curl --fail --silent --show-error --location --max-time 30 \
            https://easy3dhome.pages.dev/version.json \
            -o deployed-version.json
          python3 - <<'PY'
          import json, os
          with open('deployed-version.json') as f:
              version = json.load(f)
          assert version['commit'] == os.environ['APPROVED_SHA'], 'Public deployment does not match approved release'
          PY
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_SHA" || { echo 'Main advanced after review; refusing publication' >&2; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to reuse it' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" \
            --title "Easy3DHome $RELEASE_TAG" \
            --notes "Free, open-source local-first home planner. Download the standalone HTML or ZIP and open index.html in a modern browser. Verified source commit: $GITHUB_SHA. The packaged public website is provided for self-hosting; hosted cloud sync is not enabled by default." \
            --latest
