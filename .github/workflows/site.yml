name: Validate, bundle and publish Easy3DHome
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish Pages only after exact-main QA and screenshot review'
        type: boolean
        default: false
      approved_sha:
        description: 'Full reviewed main commit SHA (required when publishing Pages)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: easy-home-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check renderer.js
          node --check app.js
      - name: Run geometry and backup tests
        run: node --test tests/*.test.cjs
      - name: Build standalone Convika HTML and ZIP
        run: python3 scripts/build-single.py
      - name: Build allow-listed public website
        run: python3 scripts/build-site.py
      - name: Validate and package the release Worker
        run: |
          python3 scripts/check-repo-layout.py
          node --test tests/worker-release.test.mjs
          node scripts/build-worker.mjs
      - name: Upload versioned Worker module
        uses: actions/upload-artifact@v4
        with:
          name: easy3dhome-worker-module
          path: dist/worker.mjs
      - name: Upload versioned public website
        uses: actions/upload-artifact@v4
        with:
          name: easy3dhome-public-site
          path: dist/site/
      - name: Upload standalone HTML and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: easy-home-3d-convika
          path: |
            dist/easy-home-3d.html
            dist/easy-home-3d-convika.zip
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
    needs: test-and-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed exact-main revision and successful acceptance workflows
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$APPROVED_SHA"
          for workflow in e2e.yml cloud-e2e.yml release-package.yml readme-preview.yml; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$APPROVED_SHA&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.created_at, .id) | last // {}')
            jq -e --arg sha "$APPROVED_SHA" '.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success"' <<< "$run" >/dev/null || { echo "Missing successful latest exact-main run: $workflow"; exit 1; }
          done
      - name: Detect whether GitHub Pages is enabled
        id: pages-ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Pages is not enabled yet. Enable it at Settings > Pages > Source: GitHub Actions."; fi
      - name: Configure Pages
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Download tested public site
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: easy3dhome-public-site
          path: dist/site
      - name: Upload static files
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Publish
        if: steps.pages-ready.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
