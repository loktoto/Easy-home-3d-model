name: Billing signature and entitlement contract
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  billing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/billing.test.mjs
